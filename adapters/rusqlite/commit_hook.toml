schema_version = "bw.adapter/0.1"
adapter_id = "adapter:rusqlite:commit_hook"

# 冻结记录。
#
# 时点说明（如实记录）：本文件冻结于 RUSTSEC-2021-0128 家族的 joint 判定之后
# （2026-08-12，stage6-joint-2026-08-12）。与 update_hook adapter（2026-08-04
# 冻结，早于任何 P3）不同，commit_hook/rollback_hook 的 P3 判定先于本文件产生，
# 因此这两个目标的 adapter 不构成「早于判定冻结」的 Gate 证据，只作为多 nday
# 检出的合法调用描述。内容仅含公开 API 的合法调用方式，不含 drop 时机、触发
# 顺序或预期结果——危险动作序列仍由判定推导。
[freeze]
frozen_at = "2026-08-12T08:00:00Z"
frozen_at_commit = "5d7e189b1c3b7a2e8b19f9e57cf54a28d21b8f35"
p3_verdict_available_at_freeze = true
authored_from = "rusqlite 公开 API 文档与 sqlite3 commit hook 的公开文档"

[target]
crate = "rusqlite"
# vulnerable/fixed 复用同一份 adapter。
versions = ["0.26.1", "0.26.2"]
features = ["bundled", "hooks"]
api_path = "rusqlite::Connection::commit_hook"

# 以下只描述「如何合法调用这个公开 API」。
[[setup]]
step = "open_connection"
rust = "let conn = rusqlite::Connection::open_in_memory()?;"

[[setup]]
step = "create_table"
rust = "conn.execute_batch(\"CREATE TABLE t (v INTEGER)\")?;"

# 目标 API 本身怎么调。commit_hook 的公开签名（0.26.1）：
# pub fn commit_hook<'c, F>(&'c self, hook: Option<F>) where F: FnMut() -> bool + Send + 'c
[registration]
receiver = "conn"
method = "commit_hook"
callback_signature = "FnMut() -> bool"
callback_arg_index = 0
# `None` 表示清除当前回调，这是该 API 的公开语义。
accepts_none_to_clear = true

# 怎么让外部组件执行一次回调。这是**正常使用**：任何 COMMIT 完成时 SQLite 都会
# 调用 commit hook（回调返回 true 表示回滚事务；返回 false 表示提交继续）。
[trigger]
step = "commit_transaction"
rust = "conn.execute_batch(\"BEGIN; INSERT INTO t (v) VALUES (1); COMMIT\")?;"

[teardown]
step = "drop_connection"
rust = "drop(conn);"
