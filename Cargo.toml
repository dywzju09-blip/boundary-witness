[workspace]
members = [
    "crates/bw-cli",
    "crates/bw-blind-curator",
    "crates/bw-blind-model",
    "crates/bw-blind-runner",
    "crates/bw-experiment",
    "crates/bw-fuzz-observer",
    "crates/bw-model",
    "crates/bw-oracle",
    "crates/bw-runtime",
    "crates/bw-v3-nday-adapter",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
arbitrary = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
predicates = "3"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"
zstd = "0.13"
