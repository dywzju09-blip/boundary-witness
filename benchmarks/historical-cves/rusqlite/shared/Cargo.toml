[package]
name = "rusqlite-lab-shared"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
name = "rusqlite_lab_shared"
path = "src/lib.rs"

[[bin]]
name = "bw-rusqlite-d1"
path = "src/bin/bw-rusqlite-d1.rs"

[dependencies]
bw-experiment = { path = "../../../../crates/bw-experiment" }
bw-fuzz-observer = { path = "../../../../crates/bw-fuzz-observer" }
bw-model = { path = "../../../../crates/bw-model" }
bw-oracle = { path = "../../../../crates/bw-oracle" }
bw-runtime = { path = "../../../../crates/bw-runtime" }
rusqlite = { version = ">=0.26.1, <=0.26.2", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[patch.crates-io]
rusqlite = { path = "../vendor/rusqlite-0.26.1" }
