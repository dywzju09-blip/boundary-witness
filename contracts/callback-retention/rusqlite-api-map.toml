[[apis]]
api_id = "api:rusqlite:update_hook:register"
rust_path = "rusqlite::Connection::update_hook"
contract_api_id = "api:register"
callback_family = "sqlite_update_hook"
callback_arg_indices = [1]
user_data_arg_indices = [2]
non_static_callback_max_version = "0.26.1"
notes = """
Some(callback) 表示注册或替换 callback。
rusqlite 0.26.2 把这几个 hook 的 bound 从 `F: ... + 'c` 收紧到 `+ 'static`，borrowed capture \
从此在类型层面就不成立。0.26.2 及以上版本上的注册仍然是注册，但按 borrowed capture 写的 \
harness 在那里连编译都过不去——所以边界记在 non_static_callback_max_version 上，让拒绝理由 \
指向"这个版本没有这个形状"，而不是"这个版本没 vendored"。
"""

