[[apis]]
api_id = "api:rusqlite:create_scalar_function:register"
rust_path = "rusqlite::Connection::create_scalar_function"
contract_api_id = "api:register"
callback_family = "sqlite_scalar_function"
callback_arg_indices = [4]
user_data_arg_indices = [4]
non_static_callback_max_version = "0.26.1"
notes = """
注册 SQL scalar function callback。
签名是 `create_scalar_function(&self, fn_name, n_arg, flags, x_func)`，MIR 调用实参把 receiver \
算作 0，因此 callback 是 4；索引 2 是 `n_arg: c_int`，指到那里 callback 身份永远解析不出来。
user_data 索引按 api_id 查，而这个 api_id 同时覆盖 FFI 形态 \
`sqlite3_create_function_v2(db, name, nArg, eTextRep, pApp, xFunc, xStep, xFinal)`：4 是那边的 \
`pApp`。安全封装这一侧第 4 个实参是闭包不是裸指针，取 user_data 时按类型过滤掉，不会误配。
"""

