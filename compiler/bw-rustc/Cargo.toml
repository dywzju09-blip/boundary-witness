[package]
name = "bw-rustc"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace]

[[bin]]
name = "bw-rustc"
path = "src/main.rs"

[dependencies]
bw-model = { path = "../../crates/bw-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
